name: Deploy Backend

on:
  push:
    branches:
      - new-flow
  workflow_dispatch: # Allows manual triggering from the Actions tab

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -e

            # 1. Target directory and PM2 process name
            TARGET_DIR="$HOME/paperless_project/Easy-Apply-Backend"
            PM2_NAME="easy-apply-backend-backup"

            echo "Starting deployment for branch: ${{ github.ref_name }} to directory: $TARGET_DIR using PM2: $PM2_NAME"

            # 2. Navigate to project folder
            cd "$TARGET_DIR" || { echo "Directory $TARGET_DIR not found"; exit 1; }

            # 3. Pull latest code from GitHub (force reset to avoid diverged branch issues)
            git fetch origin
            git reset --hard origin/${{ github.ref_name }}

            # 4. (Removed) We no longer overwrite the .env file so manual server edits are preserved

            # 5. Install production dependencies
            npm install --omit=dev

            # 6. Restart or start the PM2 service
            pm2 restart $PM2_NAME --update-env || pm2 start server.js --name "$PM2_NAME"

            # 7. Save PM2 configuration to survive reboots
            pm2 save
