name: Deploy Backend

on:
  push:
    branches:
      - new-flow
  workflow_dispatch: # Allows manual triggering from the Actions tab

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -e

            echo "=== Starting deployment for branch: ${{ github.ref_name }} ==="

            # 1. Update repository in all known target paths
            TARGET_DIRS=("$HOME/paperless_project/Easy-Apply-Backend" "$HOME/Easy-Apply-Backend")
            FOUND_DIR=""

            for DIR in "${TARGET_DIRS[@]}"; do
              if [ -d "$DIR" ]; then
                echo "Found project directory: $DIR"
                cd "$DIR"
                echo "Pulling latest code for ${{ github.ref_name }} in $DIR..."
                git fetch origin
                git reset --hard origin/${{ github.ref_name }}
                echo "Installing dependencies..."
                npm install --omit=dev --legacy-peer-deps
                FOUND_DIR="$DIR"
              fi
            done

            if [ -z "$FOUND_DIR" ]; then
              echo "Error: Neither $HOME/paperless_project/Easy-Apply-Backend nor $HOME/Easy-Apply-Backend was found."
              exit 1
            fi

            # 2. Restart PM2 processes safely (both main and backup instances if present)
            echo "Restarting PM2 backend services..."
            pm2 restart easy-apply-backend --update-env || true
            pm2 restart easy-apply-backend-backup --update-env || true

            # 3. Save PM2 configuration to survive reboots
            pm2 save
            echo "=== Deployment completed successfully ==="
